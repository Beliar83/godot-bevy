[package]
name = "godot-bevy-itest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
path = "run_godot.rs"
name = "godot_bevy_itest"

[features]
default = ["api-4-7"]
test-frame-signal = ["godot-bevy/test-frame-signal", "godot-bevy-test/test-frame-signal"]
autosync-tests = []
harness-probes = []
harness-focus-probe = ["harness-probes"]
coverage-flush = []
profile-tracy = [
    "godot-bevy/trace_bevy",
    "godot-bevy/trace_tracy",
    "godot-bevy-test/profile-tracy",
]
api-4-2 = ["godot-bevy/api-4-2"]
api-4-3 = ["godot-bevy/api-4-3"]
api-4-4 = ["godot-bevy/api-4-4"]
api-4-5 = ["godot-bevy/api-4-5"]
api-4-6 = ["godot-bevy/api-4-6"]
api-4-7 = ["godot-bevy/api-4-7"]
api-custom-pre-4-7 = ["godot/api-custom"]
api-custom-json-pre-4-7 = ["godot/api-custom-json"]
api-custom = ["godot/api-custom"]
api-custom-json = ["godot/api-custom-json"]
[dependencies]
godot = { workspace = true, features = ["__trace"] }
godot-bevy = { path = "../../godot-bevy", features = ["register-docs"] }
godot-bevy-test = { path = "../../godot-bevy-test" }
bevy = { version = "0.19", default-features = false, features = [
  "bevy_asset",
  "multi_threaded",
] }
crossbeam-channel = "0.5"
cargo-godot-lib.workspace = true

# Ecosystem input crates exercised by input_ecosystem_tests.rs. These are real
# dependencies (not dev-dependencies): itest is a cdylib whose tests compile into
# the lib target.
leafwing-input-manager = "0.21"
bevy_enhanced_input = "0.26"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
